name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build-windows-exe:
    name: Build with PyInstaller (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --group build

      - name: Build executable
        run: uv run pyinstaller packaging/pylot-bem.spec --noconfirm

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pylot-windows-x64
          path: dist/pylot/

      - name: Create zip archive of executable
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/pylot/* -DestinationPath pylot-windows-x64.zip

      - name: Upload executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pylot-windows-x64.zip
